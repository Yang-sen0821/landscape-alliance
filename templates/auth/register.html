{% extends 'base.html' %}
{% block title %}加入景觀聯盟{% endblock %}
{% block content %}
<div class="section">
  <div class="container" style="max-width:480px">
    <div class="section-title">加入景觀聯盟</div>
    <p class="section-sub">註冊後即可上傳作品，等待審核上架展示</p>
    <div class="card" style="padding:32px">
      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
          <label>姓名 *</label>
          <input class="form-control" name="name" required placeholder="王小明">
        </div>
        <div class="form-group">
          <label>公司 / 工作室名稱 *</label>
          <input class="form-control" name="company" required placeholder="綠意設計工作室">
        </div>
        <div class="form-group">
          <label>聯絡電話 *</label>
          <input class="form-control" name="phone" required placeholder="0912-345-678" type="tel">
        </div>
        <div class="form-group">
          <label>Email *</label>
          <input class="form-control" name="email" required type="email" placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label>密碼 *（至少 8 個字元）</label>
          <input class="form-control" name="password" required type="password" placeholder="••••••••" minlength="8">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:13px">
          建立帳號
        </button>
      </form>
      <p style="text-align:center;margin-top:20px;font-size:.88rem;color:var(--gray)">
        已有帳號？<a href="{{ url_for('login') }}">登入</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
