{% extends 'base.html' %}
{% block title %}會員登入 — 台灣景觀聯盟{% endblock %}
{% block content %}
<div class="section">
  <div class="container" style="max-width:420px">
    <div class="section-title">會員登入</div>
    <p class="section-sub">登入後即可生成專屬 AI 模擬圖，並隨時回顧記錄</p>
    <div class="card" style="padding:32px">
      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="next" value="{{ next }}">
        <div class="form-group">
          <label>Email</label>
          <input class="form-control" name="email" required type="email" placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label>密碼</label>
          <input class="form-control" name="password" required type="password" placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:13px">登入</button>
      </form>

      {% if google_client_id %}
      <div style="display:flex;align-items:center;gap:12px;margin:20px 0">
        <div style="flex:1;height:1px;background:var(--border)"></div>
        <span style="font-size:.8rem;color:var(--gray)">或使用 Google 帳號繼續</span>
        <div style="flex:1;height:1px;background:var(--border)"></div>
      </div>
      <div id="g_id_onload"
           data-client_id="{{ google_client_id }}"
           data-login_uri="{{ google_login_uri }}"
           data-auto_prompt="false"></div>
      <div class="g_id_signin" style="display:flex;justify-content:center"
           data-type="standard" data-size="large" data-text="continue_with"
           data-shape="pill" data-locale="zh_TW"></div>
      <script src="https://accounts.google.com/gsi/client" async defer></script>
      {% endif %}

      <p style="text-align:center;margin-top:20px;font-size:.88rem;color:var(--gray)">
        還沒帳號？<a href="{{ url_for('account_register', next=next) }}">免費註冊</a>
      </p>
      <p style="text-align:center;margin-top:8px;font-size:.78rem;color:var(--gray)">
        設計師 / 施工夥伴請改用 <a href="{{ url_for('login') }}">夥伴登入</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
