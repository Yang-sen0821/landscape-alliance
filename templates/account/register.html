{% extends 'base.html' %}
{% block title %}免費註冊 — 台灣景觀聯盟{% endblock %}
{% block content %}
<div class="section">
  <div class="container" style="max-width:460px">
    <div class="section-title">免費註冊</div>
    <p class="section-sub">註冊後即可生成專屬 AI 景觀模擬圖，並隨時回顧記錄</p>
    <div class="card" style="padding:32px">
      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="next" value="{{ next }}">
        <div class="form-group">
          <label>姓名 *</label>
          <input class="form-control" name="name" required placeholder="王小明">
        </div>
        <div class="form-group">
          <label>Email *</label>
          <input class="form-control" name="email" required type="email" placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label>密碼 *（至少 8 個字元）</label>
          <input class="form-control" name="password" required type="password" placeholder="••••••••" minlength="8">
        </div>
        {% if recaptcha_site_key %}
        <div class="form-group">
          <div class="g-recaptcha" data-sitekey="{{ recaptcha_site_key }}"></div>
        </div>
        <script src="https://www.google.com/recaptcha/api.js" async defer></script>
        {% endif %}
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:13px">
          建立帳號
        </button>
      </form>

      {% if google_client_id %}
      <div style="display:flex;align-items:center;gap:12px;margin:20px 0">
        <div style="flex:1;height:1px;background:var(--border)"></div>
        <span style="font-size:.8rem;color:var(--gray)">或使用 Google 帳號繼續</span>
        <div style="flex:1;height:1px;background:var(--border)"></div>
      </div>
      <div id="g_id_onload"
           data-client_id="{{ google_client_id }}"
           data-login_uri="{{ google_login_uri }}"
           data-auto_prompt="false"></div>
      <div class="g_id_signin" style="display:flex;justify-content:center"
           data-type="standard" data-size="large" data-text="continue_with"
           data-shape="pill" data-locale="zh_TW"></div>
      <script src="https://accounts.google.com/gsi/client" async defer></script>
      {% endif %}

      <p style="text-align:center;margin-top:20px;font-size:.88rem;color:var(--gray)">
        已有帳號？<a href="{{ url_for('account_login', next=next) }}">登入</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
