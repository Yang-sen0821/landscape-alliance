{% extends 'base.html' %}
{% block title %}供應商註冊 — 台灣景觀聯盟{% endblock %}
{% block content %}
<div class="section">
  <div class="container" style="max-width:480px">
    <div style="text-align:center;margin-bottom:28px">
      <div style="font-size:1.6rem;font-weight:700;color:var(--g900)">供應商加入</div>
      <p style="color:var(--gray);margin-top:6px;font-size:.92rem">上傳您的產品素材，觸及全台景觀設計師與業主</p>
    </div>
    <div class="card" style="padding:32px">
      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
          <label>公司名稱 *</label>
          <input class="form-control" name="company" required placeholder="例：大綠地戶外家具有限公司">
        </div>
        <div class="form-group">
          <label>聯絡人姓名 *</label>
          <input class="form-control" name="contact" required placeholder="負責人或業務聯絡人">
        </div>
        <div class="form-group">
          <label>聯絡電話 *</label>
          <input class="form-control" name="phone" required type="tel" placeholder="0912-345-678">
        </div>
        <div class="form-group">
          <label>Email *</label>
          <input class="form-control" name="email" required type="email" placeholder="company@example.com">
        </div>
        <div class="form-group">
          <label>設定密碼 * <span style="color:var(--gray);font-weight:400;font-size:.82rem">（至少 8 個字元）</span></label>
          <input class="form-control" name="password" required type="password" minlength="8">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:13px;margin-top:8px">
          建立供應商帳號
        </button>
      </form>
    </div>
    <p style="text-align:center;margin-top:16px;font-size:.88rem;color:var(--gray)">
      已有帳號？<a href="{{ url_for('supplier_login') }}">登入供應商後台</a>
    </p>
  </div>
</div>
{% endblock %}
